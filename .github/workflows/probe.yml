# External synthetic check for QuestGro (https://cg.oculogic.io).
#
# Why this exists: the app runs on a Mac Mini behind a Cloudflare tunnel. A
# watchdog on that Mac cannot report that the Mac is gone. This job runs on
# GitHub's infrastructure, outside that network, and probes the public URL.
#
# It carries NO Telegram/Gmail credentials. On success it pings a Healthchecks.io
# check; on failure it pings <url>/fail and exits non-zero. Healthchecks.io then
# emails carl@oculogicgroup.com — both when a probe reports failure and when the
# probes stop arriving at all.
#
# To repoint at Render later: change HEALTH_URL below. Nothing else.
name: questgro-external-probe

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub may delay scheduled runs under load; this is a backstop layer.
  workflow_dispatch:

concurrency:
  group: questgro-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEALTH_URL: https://cg.oculogic.io/health
      HC_PING_URL: ${{ secrets.HC_PING_URL }}
    steps:
      - name: Probe /health (3 attempts — a single blip must not alert)
        run: |
          ok=0; code=000
          for i in 1 2 3; do
            code=$(curl -sS -m 15 -o /tmp/body.json -w '%{http_code}' "$HEALTH_URL" || echo 000)
            status=$(python3 -c "import json;print(json.load(open('/tmp/body.json')).get('status',''))" 2>/dev/null || echo "")
            echo "attempt $i: http=$code status=$status"
            if [ "$code" = "200" ] && [ "$status" = "ok" ]; then ok=1; break; fi
            [ $i -lt 3 ] && sleep 20
          done
          echo "body: $(head -c 400 /tmp/body.json 2>/dev/null)"
          if [ "$ok" = "1" ]; then
            if [ -n "$HC_PING_URL" ]; then curl -fsS -m 10 "$HC_PING_URL" >/dev/null && echo "heartbeat: sent"; fi
            echo "QuestGro is UP (http=$code)"
          else
            if [ -n "$HC_PING_URL" ]; then curl -fsS -m 10 --data-binary @/tmp/body.json "$HC_PING_URL/fail" >/dev/null || true; fi
            echo "::error::QuestGro health probe FAILED from GitHub (http=$code)"
            exit 1
          fi
